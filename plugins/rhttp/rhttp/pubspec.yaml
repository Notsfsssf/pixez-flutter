name: rhttp
description: Make HTTP requests using Rust for Flutter developers. It uses FFI to call Rust functions from Dart. On the Rust side, it uses reqwest to make HTTP requests.
version: 0.18.0
repository: https://codeberg.org/Tienisto/rhttp
topics:
  - http
  - rust
  - ffi
  - http2
  - http3
funding:
  - https://github.com/sponsors/Tienisto/

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  freezed_annotation: ^3.0.0
  http: ^1.5.0
  http_profile: ^0.1.0
  meta: ^1.12.0

dev_dependencies:
  build_runner: ^2.4.0
  ffi: ^2.1.0
  ffigen: ^11.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0'
  freezed: ^3.0.0
  mocktail: ^1.0.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Android still needs a plugin class so rustls-platform-verifier can
  # capture the application context. Other platforms bundle the Rust
  # library through the Native Assets build hook in hook/build.dart.
  plugin:
    platforms:
      android:
        package: com.flutter_rust_bridge.rhttp
        pluginClass: RhttpPlugin

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
